# Default store/theme for this project. Applied automatically by the Shopify
# CLI when no -e/--environment flag is passed, so `shopify theme dev` /
# `shopify theme push` no longer need --store/--theme typed out each time.
#
# `theme` is pinned to "新主题-开发环境-Iris" (#161580155126), a dedicated
# unpublished theme for the shopify-theme-new rebuild. This is deliberate:
# leaving `theme` unset makes `shopify theme dev` create a fresh temporary
# theme by duplicating whatever theme is currently LIVE on the store (the
# old shopify-theme-old codebase) as its base, then overlaying local files
# on top — silently pulling in the old theme's leftover templates and
# settings_data.json. Pinning to this theme keeps local dev fully isolated
# from the live/old theme.
[environments.default]
store = "moody-tiger-athletics.myshopify.com"
theme = "161580155126"

# Dev store for BF Spin & Win backend integration (Lily's App Proxy, test
# orders). Use explicitly: `shopify theme dev -e dev` / `shopify theme push -e dev`.
# `theme` is pinned to "BF Spin 开发" (#167518339158, unpublished) so
# `theme dev -e dev` never spawns a fresh duplicate.
[environments.dev]
store = "moodytiger-us-dev.myshopify.com"
theme = "167518339158"

# Dev store theme for the Welcome Spin (new-customer email spin) integration,
# kept separate so it never overwrites the BF Spin theme above. Use explicitly:
# `shopify theme dev -e welcome` / `shopify theme push -e welcome`.
# `theme` is pinned to #167699677270 (unpublished, created for this feature).
[environments.welcome]
store = "moodytiger-us-dev.myshopify.com"
theme = "167699677270"
